[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ieee39-renewable-transient-stability"
version = "1.0.0"
description = "IEEE39 transient stability, automated CCT search and renewable scenario comparison"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-or-later"
dependencies = ["andes==2.0.0", "numpy==2.5.3", "pandas==3.0.6", "openpyxl==3.1.5", "matplotlib==3.11.2"]

[tool.setuptools.packages.find]
where = ["src"]
